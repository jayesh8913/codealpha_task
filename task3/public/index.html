<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📋 TaskBoard</h1>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">Projects</a>
                <div id="auth-buttons">
                    <button id="login-btn" class="btn btn-outline">Login</button>
                    <button id="register-btn" class="btn btn-primary">Sign Up</button>
                </div>
                <div id="user-info" style="display: none;">
                    <img id="user-avatar" src="" alt="Avatar" class="user-avatar">
                    <span id="user-name"></span>
                    <button id="notifications-btn" class="btn btn-outline" title="Notifications">
                        🔔 <span id="notification-count" class="badge">0</span>
                    </button>
                    <button id="logout-btn" class="btn btn-outline">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div id="auth-required" class="auth-required" style="display: none;">
            <h2>Welcome to TaskBoard</h2>
            <p>Please login or register to manage your projects</p>
        </div>

        <div id="main-content" style="display: none;">
            <div class="projects-header">
                <h2>My Projects</h2>
                <button id="create-project-btn" class="btn btn-primary">+ New Project</button>
            </div>

            <div id="projects-grid" class="projects-grid">
                <!-- Projects will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <p id="login-error" class="error-message"></p>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Sign Up</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" required minlength="3" maxlength="30">
                </div>
                <div class="form-group">
                    <label for="register-name">Full Name</label>
                    <input type="text" id="register-name" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
            </form>
            <p id="register-error" class="error-message"></p>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div id="create-project-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create New Project</h2>
            <form id="create-project-form">
                <div class="form-group">
                    <label for="project-name">Project Name</label>
                    <input type="text" id="project-name" required>
                </div>
                <div class="form-group">
                    <label for="project-description">Description</label>
                    <textarea id="project-description" rows="4"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Project</button>
            </form>
            <p id="create-project-error" class="error-message"></p>
        </div>
    </div>

    <!-- Notifications Modal -->
    <div id="notifications-modal" class="modal">
        <div class="modal-content modal-large">
            <span class="close">&times;</span>
            <div class="notifications-header">
                <h2>Notifications</h2>
                <button id="mark-all-read-btn" class="btn btn-outline">Mark All Read</button>
            </div>
            <div id="notifications-list" class="notifications-list">
                <!-- Notifications will be loaded here -->
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
